<!DOCTYPE html>
<html>
<head>
  <title>CSS3D Iframe Test</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; }
    #container { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
    #info { position: fixed; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,.7); padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="info">
    <p>If you can click the YouTube play button, CSS3D iframe interaction works.</p>
    <p id="debug"></p>
  </div>
  <div id="container"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/examples/jsm/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { CSS3DRenderer, CSS3DObject } from 'three/examples/jsm/renderers/CSS3DRenderer.js';

    const container = document.getElementById('container');
    const debug = document.getElementById('debug');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
    camera.position.set(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const sphereGeo = new THREE.SphereGeometry(500, 32, 32);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.BackSide });
    scene.add(new THREE.Mesh(sphereGeo, sphereMat));

    // CSS3D
    const cssRenderer = new CSS3DRenderer();
    const cssElement = cssRenderer.domElement;
    cssElement.style.position = 'absolute';
    cssElement.style.inset = '0';
    cssElement.style.overflow = 'hidden';
    cssElement.style.pointerEvents = 'none';
    cssElement.style.zIndex = '2';
    container.appendChild(cssElement);

    debug.textContent = 'viewElement pointer-events: ' +
      (cssElement.children[0]?.style.pointerEvents || 'not set');

    const wrapper = document.createElement('div');
    wrapper.style.width = '640px';
    wrapper.style.height = '360px';
    wrapper.style.background = '#000';
    wrapper.style.overflow = 'hidden';
    wrapper.style.borderRadius = '8px';
    wrapper.style.pointerEvents = 'auto';

    const iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/dQw4w9WgXcQ';
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = 'none';
    iframe.style.pointerEvents = 'auto';
    iframe.allow = 'autoplay; fullscreen';
    iframe.allowFullscreen = true;
    wrapper.appendChild(iframe);

    const cssObj = new CSS3DObject(wrapper);
    const SCALE = 150 / 640;
    cssObj.scale.setScalar(SCALE);

    const R = 520;
    cssObj.position.set(0, 0, -R);
    cssObj.lookAt(0, 0, 0);
    scene.add(cssObj);

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
      cssRenderer.render(scene, camera);
    }
    animate();

    wrapper.addEventListener('pointerdown', () => {
      debug.textContent = 'pointerdown detected on wrapper!';
    });
    wrapper.addEventListener('click', () => {
      debug.textContent = 'click detected on wrapper!';
    });
  </script>
</body>
</html>
